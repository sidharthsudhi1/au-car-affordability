[project]
name = "carafford"
version = "0.1.0"
description = "Australian car affordability: ABS prices and earnings joined to 2023 vehicle listings"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "requests==2.34.2",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "statsmodels==0.15.0",
    "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "jupyter==1.1.1", "nbconvert==7.17.1", "ipykernel"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
